[package]
name = "room"
version = "0.1.0"
edition = "2021"
description = "A Rust implementation of the doomgeneric platform layer using winit and wgpu"
repository = "https://github.com/sunsided/room"
license = "GPL-2.0"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
readme = "../README.md"

[lib]
name = "room"
path = "src/lib.rs"

[[bin]]
name = "doommw2"
path = "src/main.rs"

[features]
dhat-heap = ["dep:dhat"]
rangecheck = []
# Test-only hooks (sheet 05 mode override; sheet 13 adds more). Off in the shipped binary.
test-hooks = []

[dependencies]
# Cross-platform window creation and event handling.
winit = "0.30"

# Cross-platform GPU API.
wgpu = { version = "29", features = ["wgsl"] }

# Blocking async executor – used to wait for wgpu futures.
pollster = "0.4"

# Safe transmutation between byte slices and typed buffers.
bytemuck = { version = "1", features = ["derive"] }

# Logging facade.
log = "0.4"

# Cross-platform audio playback, used for SFX.
rodio = "0.22"

# Pure-Rust SF2 soundfont synthesizer, used for Doom music playback.
rustysynth = "1"

# Simple logger backed by stderr.
env_logger = "0.11"

# libc bindings for C FFI (FILE, fopen, fclose, fseek, fread, printf, etc.)
libc = "0.2"

# Optional heap profiler (use with --features dhat-heap).
dhat = { version = "0.3", optional = true }

# DOOMMW2 crates and shared dependencies (versions pinned in the workspace root).
dmw_format = { path = "../crates/dmw_format" }
dmw_weapons = { path = "../crates/dmw_weapons" }
dmw_viewmodel = { path = "../crates/dmw_viewmodel" }
glam.workspace = true
weapon_iw4.workspace = true
serde.workspace = true
toml.workspace = true

[dev-dependencies]
# C layout-guard tests: compiles test_helpers.c to verify C struct offsets
# match the ported Rust equivalents. Only linked into the test binary.
doomgeneric-sys = { path = "../doomgeneric-sys" }
# Enables the `test-hooks` feature for the integration tests only (they are compiled with
# dev-dependencies; the shipped `doommw2` binary is not).
room = { path = ".", features = ["test-hooks"] }
# PNG encode/decode for the golden-image tooling (sheet 13 section 5.4).
png.workspace = true
