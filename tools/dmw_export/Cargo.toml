[package]
name = "dmw_export"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Offline exporter: MW2 install to DOOMMW2 pack (sheet 04)."

[workspace]   # standalone: not a member of the root workspace

[dependencies]
dmw_format = { path = "../../crates/dmw_format" }
# iw4L at IW4L_REV (tools/check-iw4l-rev.sh). Local checkout: see ../../.cargo/config.toml.example.
assets = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_game = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_model = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_anim = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_audio = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_material = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_transport = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
asset_core = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
frame = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
master_protocol = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
weapon_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
xmodel_runtime = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
dpvs_iw4 = { git = "https://github.com/vladtrc/iw4L", rev = "fc3d8eaf6045cb131eb74cd41954f0c4922b9913" }
bevy = { version = "0.20", default-features = false }   # must match iw4L's workspace bevy version exactly
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[patch.crates-io]
# copied from ../iw4L/Cargo.toml at IW4L_REV
quinn-proto = { git = "https://github.com/quinn-rs/quinn", rev = "f650e0f213b01ea7bebd60023e5df7df65e5c2bd" }

[profile.dev]
opt-level = 3
[profile.release]
debug = 1

# Same lint table as the root workspace (a standalone workspace cannot inherit it).
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
todo = "warn"
unwrap_used = "warn"
expect_used = "warn"
print_stdout = "deny"
print_stderr = "deny"
float_cmp = "warn"
